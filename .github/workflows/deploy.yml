name: Deploy SQL Server (Docker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
  IMAGE: mcr.microsoft.com/mssql/server:2022-latest
  CONTAINER: sqlserver

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar que exista el secret
        run: |
          if [ -z "$SA_PASSWORD" ]; then
            echo "::error::Falta el secret MSSQL_SA_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Secret MSSQL_SA_PASSWORD disponible (su valor se oculta en los logs)."

      - name: Iniciar contenedor de SQL Server
        run: |
          docker run -d --name "$CONTAINER" \
            -e "ACCEPT_EULA=$ACCEPT_EULA" \
            -e "MSSQL_PID=$MSSQL_PID" \
            -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 1433:1433 \
            "$IMAGE"
          docker ps

      - name: Esperar a que SQL Server acepte conexiones
        run: |
          # La imagen 2022 trae mssql-tools18 (requiere -C para confiar en el certificado)
          if docker exec "$CONTAINER" test -x /opt/mssql-tools18/bin/sqlcmd; then
            echo "SQLCMD=/opt/mssql-tools18/bin/sqlcmd -C" >> "$GITHUB_ENV"
            SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C"
          else
            echo "SQLCMD=/opt/mssql-tools/bin/sqlcmd" >> "$GITHUB_ENV"
            SQLCMD="/opt/mssql-tools/bin/sqlcmd"
          fi
          for i in $(seq 1 30); do
            if docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" \
                 $SQLCMD -S localhost -U sa -Q "SELECT @@VERSION" > /dev/null 2>&1; then
              echo "SQL Server listo (intento $i)."
              docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" \
                $SQLCMD -S localhost -U sa -h -1 -Q "SET NOCOUNT ON; SELECT @@VERSION"
              exit 0
            fi
            echo "Esperando a SQL Server... ($i/30)"
            sleep 5
          done
          echo "::error::SQL Server no respondió a tiempo."
          docker logs "$CONTAINER"
          exit 1

      - name: Copiar scripts SQL al contenedor
        run: docker cp ./sql "$CONTAINER":/sql

      - name: Crear base de datos
        run: docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" $SQLCMD -S localhost -U sa -b -f 65001 -i /sql/create_database.sql

      - name: Crear tablas
        run: docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" $SQLCMD -S localhost -U sa -b -f 65001 -i /sql/create_tables.sql

      - name: Crear procedimientos almacenados
        run: docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" $SQLCMD -S localhost -U sa -b -f 65001 -i /sql/create_procedure.sql

      - name: Crear trigger
        run: docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" $SQLCMD -S localhost -U sa -b -f 65001 -i /sql/create_trigger.sql

      - name: Insertar datos de prueba
        run: docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" $SQLCMD -S localhost -U sa -b -f 65001 -W -i /sql/test_data.sql

      - name: Ejecutar validaciones
        run: docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" $SQLCMD -S localhost -U sa -b -f 65001 -i /sql/validate.sql

      - name: Mostrar objetos creados
        run: |
          docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" $SQLCMD -S localhost -U sa -d EmpresaDB -W -Q "
            SET NOCOUNT ON;
            SELECT name AS Objeto, type_desc AS Tipo
              FROM sys.objects
             WHERE type IN ('U','P','TR')
             ORDER BY type_desc, name;"

      - name: Logs del contenedor (solo si algo falló)
        if: failure()
        run: docker logs "$CONTAINER" | tail -n 100

      - name: Detener contenedor
        if: always()
        run: docker rm -f "$CONTAINER" || true
